<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Open the study</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f6f7fb; color:#20273d; font:18px/1.6 system-ui,sans-serif; }
    main { max-width:32rem; margin:24px; padding:36px; border:1px solid #e1e4ec; border-radius:20px; background:white; }
    h1 { margin:0 0 12px; font-size:28px; } p { margin:0 0 20px; }
    button { border:0; border-radius:10px; padding:12px 22px; background:#4659d7; color:white; font:inherit; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Opening the study</h1>
    <p id="status" role="status">Connecting you to the study. This should only take a moment.</p>
    <button id="retry" hidden>Try again</button>
    <noscript>Please enable JavaScript to open your study invitation.</noscript>
  </main>
  <script src="entry.js"></script>
</body>
</html>
